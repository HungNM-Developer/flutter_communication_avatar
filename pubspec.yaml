name: flutter_communication_avatar
description: A production-ready Flutter plugin for native communication push notifications with user avatars on iOS (INSendMessageIntent) and Android (MessagingStyle).
version: 1.0.0
repository: https://github.com/hungnguyen/flutter_communication_avatar
issue_tracker: https://github.com/hungnguyen/flutter_communication_avatar/issues
topics:
  - notifications
  - communication
  - avatar
  - push-notifications
  - messaging

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.hungnguyen.flutter_communication_avatar
        pluginClass: FlutterCommunicationAvatarPlugin
      ios:
        pluginClass: FlutterCommunicationAvatarPlugin
